# Netlify baut die Seite bei jedem Push neu (auch nach dem täglichen Termin-Lauf auf GitHub)
[build]
  command = "cd site && python3 build.py"
  publish = "site"

[build.environment]
  PYTHON_VERSION = "3.12"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
